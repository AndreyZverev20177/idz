# CI GitHub Actions: запускает проверки Python при push и pull request.
# Локальная успешность тестов не заменяет проверку статуса workflow в GitHub.
name: Test and lint
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: black --check app.py main.py music_analysis.py utils tests
      - run: flake8 app.py main.py music_analysis.py utils tests --max-line-length=88 --extend-ignore=E203,W503
